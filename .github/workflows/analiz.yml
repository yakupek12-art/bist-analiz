on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Hisse kodu (orn: ASELS.IS)'
        required: true
        type: string
      skip_veri:
        description: 'Veri cekmeyi atla'
        type: boolean
        default: false

name: BIST Finansal Analiz

jobs:
  analiz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TA-Lib (Ubuntu 24.04 via PPA)
        run: |
          sudo add-apt-repository -y ppa:mariofr2/ta-lib
          sudo apt-get update -qq
          sudo apt-get install -y -qq libta-lib0-dev
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python run_analiz.py "${{ github.event.inputs.symbol }}" ${{ github.event.inputs.skip_veri && '--skip-veri' || '' }}
      - name: Send Telegram (opsiyonel)
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_gonder.py
      - uses: actions/upload-artifact@v4
        with:
          name: rapor-${{ github.event.inputs.symbol }}
          path: analiz-arşivi/
          retention-days: 30