on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Hisse kodu (orn: ASELS.IS)'
        required: true
        type: string
      skip_veri:
        description: 'Veri cekmeyi atla'
        type: boolean
        default: false

name: BIST Finansal Analiz

jobs:
  analiz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TA-Lib from source (patched)
        run: |
          cd /tmp
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib
          # Fix gen_code Makefile for modern automake/glibc
          sed -i 's/\\.Tpo/\\.Plo/g' src/tools/gen_code/Makefile.in
          sed -i 's/\\.Tpo/\\.Plo/g' src/tools/gen_code/Makefile.am
          ./configure --prefix=/usr
          make -j$(nproc)
          sudo make install
          cd /tmp && rm -rf ta-lib ta-lib-0.4.0-src.tar.gz
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python run_analiz.py "${{ github.event.inputs.symbol }}" ${{ github.event.inputs.skip_veri && '--skip-veri' || '' }}
      - name: Send Telegram (opsiyonel)
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_gonder.py
      - uses: actions/upload-artifact@v4
        with:
          name: rapor-${{ github.event.inputs.symbol }}
          path: analiz-arşivi/
          retention-days: 30