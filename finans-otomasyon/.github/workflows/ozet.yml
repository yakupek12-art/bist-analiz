name: gunluk-ozet

on:
  schedule:
    # UTC saatleri (Turkiye = UTC+3)
    - cron: "30 5 * * 1-5"   # TR: 08:30 - sabah ozeti (hafta ici)
    - cron: "0 16 * * 1-5"   # TR: 19:00 - aksam kapanis ozeti (hafta ici)
  workflow_dispatch: {}      # GitHub uzerinden elle tetikleme (test icin)

jobs:
  ozet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ozeti hazirla ve gonder
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
          MODEL: ${{ secrets.MODEL }}
        run: python scripts/gunluk_ozet.py
